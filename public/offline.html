<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Presentia – Hors ligne</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            background: #fff8f4;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 1.5rem;
            text-align: center;
            gap: 1rem;
        }
        .icon { font-size: 3rem; }
        h1 { font-size: 1.5rem; font-weight: 600; }
        p  { color: #6b7280; max-width: 24rem; line-height: 1.6; }
        button {
            margin-top: .5rem;
            padding: .625rem 1.25rem;
            background: #e8720c;
            color: #fff;
            border: none;
            border-radius: .5rem;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #c96209; }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Presentia nécessite une connexion réseau pour fonctionner correctement. Vérifiez votre connexion et réessayez.</p>
    <button onclick="window.location.reload()">Réessayer</button>
</body>
</html>
